---
- hosts: all
  become: false
  tasks:
    - name: Download doom-emacs code
      git:
        repo: https://github.com/hlissner/doom-emacs
        dest: "{{ ansible_facts['user_dir'] }}/.emacs.d"
        executable: /usr/bin/git
        clone: yes
        update: yes
        version: master
        single_branch: true
        depth: 1
